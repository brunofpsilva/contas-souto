# Syncs the Wallet balances every hour by calling the app on Vercel.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   APP_URL      the app's address, e.g. https://contas-souto.vercel.app
#   CRON_SECRET  the same value as in the Vercel variables
name: Sync Wallet

on:
  schedule:
    - cron: "7 * * * *" # every hour (UTC); minute 7 avoids the top of the hour, when GitHub is busiest
  workflow_dispatch: # allows running it by hand in the Actions tab

permissions: {}

concurrency:
  group: sync-wallet
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ask the app to sync
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::The APP_URL and/or CRON_SECRET secrets are missing; nothing to do."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST "${APP_URL%/}/api/cron/sync" \
            -H "Authorization: Bearer $CRON_SECRET"
          echo
